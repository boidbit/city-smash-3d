name: Build Play Store AAB

# Manual only: Actions tab -> "Build Play Store AAB" -> Run workflow (pick any branch).
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - run: npm install

      - name: Copy latest game into www
        run: |
          cp index.html www/index.html
          mkdir -p www/monster-dash && cp monster-dash/index.html www/monster-dash/index.html

      - run: npx cap sync android

      - run: chmod +x android/gradlew

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing - Play Store needs a signed bundle."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/city-smash.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/city-smash.jks" >> "$GITHUB_ENV"

      - name: Build release AAB
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: city-smash-3d-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
